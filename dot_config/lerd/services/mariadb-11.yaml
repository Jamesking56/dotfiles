name: mariadb-11
image: docker.io/library/mariadb:11
ports:
    - 3306:3306
environment:
    MARIADB_DATABASE: lerd
    MARIADB_ROOT_PASSWORD: lerd
data_dir: /var/lib/mysql
env_vars:
    - DB_CONNECTION=mysql
    - DB_HOST=lerd-mariadb-11
    - DB_PORT=3306
    - DB_DATABASE=lerd
    - DB_USERNAME=root
    - DB_PASSWORD=lerd
connection_url: mysql://root:lerd@127.0.0.1:3306/lerd
description: MariaDB (MySQL-compatible) versions
family: mariadb
preset: mariadb
preset_version: "11"
init: true
